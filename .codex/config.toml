# Codex CLI Project Configuration
# This file enables project-specific Codex settings

# Default model configuration
model = "gpt-5.3-codex"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"

# Web search
web_search = "enabled"

# Approval policy
approval_policy = "on-request"

# Feature toggles
[features]
skills = true

# Skills configuration - enable project skills
[[skills.config]]
enabled = true
path = ".codex/skills/context-loader"

# 日本語訳（コメント）
# Codex CLI プロジェクト設定
# - model: デフォルトモデル
# - model_reasoning_effort: 推論努力レベル
# - model_reasoning_summary: 推論サマリの詳細度
# - web_search: Web検索の有効化
# - approval_policy: 承認ポリシー
# - features.skills: スキル機能の有効化
# - skills.config: プロジェクトスキルの有効化とパス
